[project]
name = "paste-by-keyboard"
version = "4.0"
description = "A simple script for pasting in no-clipboard applications using your keyboard."
readme = "README.md"
requires-python = ">=3.13"

authors = [
    { name = "vuxxs", email = "57200277+vuxxs@users.noreply.github.com" }
]

dependencies = [
    "clipboard>=0.0.4",
    "keyboard>=0.13.5",
    "pyautogui>=0.9.54",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]

[project.gui-scripts]
paste-by-keyboard = "main:main"